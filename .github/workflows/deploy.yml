name: Build and Deploy Secure Memo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/secure-memo:${{ github.sha }}

jobs:
  # ==========================================
  # CI: GitHub Hosted Runner
  # ==========================================

  build:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub

        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

        run: |
          echo "$DOCKER_TOKEN" | docker login \
            -u "$DOCKER_USER" \
            --password-stdin

      - name: Build Docker image

        run: |
          docker build \
            --build-arg BUILD_VERSION="$GITHUB_SHA" \
            -t "$IMAGE" .

      - name: Validate Python syntax

        run: |
          docker run --rm "$IMAGE" python -c \
            "import ast,pathlib; ast.parse(pathlib.Path('/app/app.py').read_text())"

      - name: Push image to Docker Hub

        run: |
          docker push "$IMAGE"

          LATEST="${IMAGE%:*}:latest"

          docker tag "$IMAGE" "$LATEST"
          docker push "$LATEST"

      - name: Export Docker image

        run: |
          docker save "$IMAGE" | gzip > image.tar.gz

      - name: Upload deployment artifact

        uses: actions/upload-artifact@v4

        with:
          name: deployment-image
          path: image.tar.gz
          retention-days: 1

      - name: Cleanup credentials

        if: always()

        run: docker logout

  # ==========================================
  # CD: Mac Self-hosted Runner
  # ==========================================

  deploy:
    needs: build

    runs-on: [self-hosted, macOS, ARM64]

    timeout-minutes: 15

    steps:
      - name: Download Docker image

        uses: actions/download-artifact@v4

        with:
          name: deployment-image

      - name: Deploy via SSH

        shell: bash

        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

        run: |

          set -euo pipefail

          SSH_DIR=$(mktemp -d)

          trap 'rm -rf "$SSH_DIR"' EXIT

          chmod 700 "$SSH_DIR"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$SSH_DIR/deploy_key"

          chmod 600 "$SSH_DIR/deploy_key"

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > "$SSH_DIR/known_hosts"

          SSH_OPTIONS=(
            -i "$SSH_DIR/deploy_key"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$SSH_DIR/known_hosts"
            -o BatchMode=yes
            -o ConnectTimeout=15
          )

          echo "Transferring Docker image"

          ssh "${SSH_OPTIONS[@]}" \
            "$SSH_USER@$SSH_HOST" \
            "bash -o pipefail -c 'gzip -dc | docker load'" \
            < image.tar.gz

          echo "Starting Blue-Green deployment"

          ssh "${SSH_OPTIONS[@]}" \
            "$SSH_USER@$SSH_HOST" \
            "bash ~/secure-memo/deploy.sh '$IMAGE'"

      - name: Cleanup deployment artifact

        if: always()

        shell: bash

        run: rm -f image.tar.gz
