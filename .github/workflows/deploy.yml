name: Build and Deploy Secure Memo

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment

  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/secure-memo:${{ github.sha }}

    steps:
      # ====================================
      # 1. Checkout
      # ====================================

      - name: Checkout source code

        uses: actions/checkout@v4

      # ====================================
      # 2. Docker Hub Login
      # ====================================

      - name: Login to Docker Hub

        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}

          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

        run: |

          echo "$DOCKER_TOKEN" | docker login \
            -u "$DOCKER_USER" \
            --password-stdin

      # ====================================
      # 3. Build Image
      # ====================================

      - name: Build Docker image

        run: |

          docker build \
            --build-arg BUILD_VERSION="$GITHUB_SHA" \
            -t "$IMAGE" .

      # ====================================
      # 4. Image Validation
      # ====================================

      - name: Validate Python syntax

        run: |

          docker run --rm "$IMAGE" \
            python -c \
            "import ast,pathlib; ast.parse(pathlib.Path('/app/app.py').read_text())"

      # ====================================
      # 5. Push Image
      # ====================================

      - name: Push image to Docker Hub

        run: |

          docker push "$IMAGE"

          LATEST="${IMAGE%:*}:latest"

          docker tag "$IMAGE" "$LATEST"

          docker push "$LATEST"

      # ====================================
      # 6. Deploy to Production
      # ====================================

      - name: Deploy via SSH

        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}

          SSH_USER: ${{ secrets.SSH_USER }}

          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

        run: |

          mkdir -p ~/.ssh

          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "bash ~/secure-memo/deploy.sh '$IMAGE'"

      # ====================================
      # 7. Cleanup
      # ====================================

      - name: Cleanup credentials

        if: always()

        run: |

          docker logout || true

          rm -f ~/.ssh/deploy_key
