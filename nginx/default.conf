limit_req_zone $binary_remote_addr
    zone=login_limit:10m
    rate=10r/m;

upstream memo_backend {

    include /etc/nginx/runtime/active.inc;

}

# HTTP Server

server {

    listen 80;

    server_name _;

    return 308 https://$host$request_uri;
}


# HTTPS Server

server {

    listen 443 ssl;

    server_name _;

    server_tokens off;

    ssl_certificate
        /etc/nginx/certs/server.crt;

    ssl_certificate_key
        /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32k;


    # Security Headers

    add_header X-Content-Type-Options
        "nosniff" always;

    add_header X-Frame-Options
        "DENY" always;

    add_header Referrer-Policy
        "no-referrer" always;

    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
        always;


    # Reverse Proxy Settings

    proxy_http_version 1.1;

    proxy_set_header Host $host;

    proxy_set_header X-Real-IP $remote_addr;

    proxy_set_header X-Forwarded-For
        $proxy_add_x_forwarded_for;

    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;

    proxy_read_timeout 30s;


    # Login Rate Limit

    location = /api/login {

        limit_req zone=login_limit burst=10 nodelay;

        limit_req_status 429;

        proxy_pass http://memo_backend;

    }


    # Main Reverse Proxy

    location / {

        proxy_pass http://memo_backend;

    }
}