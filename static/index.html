<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Secure Memo | Cloud Engineering</title>

    <link rel="stylesheet" href="/static/style.css" />

    <script src="/static/app.js" defer></script>
  </head>

  <body>
    <header>
      <div class="header-inner">
        <div>
          <h1>Secure Memo</h1>
          <p>Cloud Engineering Workspace</p>
        </div>

        <span class="secure-label"> Secure Connection </span>
      </div>
    </header>

    <main>
      <!-- Login Section -->

      <section id="login-section" class="card login-card">
        <h2>보안 메모장 로그인</h2>

        <p class="description">인증된 사용자만 접근할 수 있습니다.</p>

        <form id="login-form">
          <label for="username">Username</label>

          <input id="username" type="text" autocomplete="username" required />

          <label for="password">Password</label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          />

          <button type="submit">로그인</button>
        </form>

        <p id="login-message" class="message"></p>
      </section>

      <!-- Memo Section -->

      <section id="memo-section" hidden>
        <div class="card profile">
          <div>
            <span class="authenticated"> Authenticated User </span>

            <h2 id="full-name"></h2>

            <p>
              GitHub:
              <span id="github-id"></span>
            </p>
          </div>

          <button id="logout-button" class="secondary-button">로그아웃</button>
        </div>

        <div class="card">
          <h2>새 메모 작성</h2>

          <form id="memo-form">
            <label for="title">제목</label>

            <input
              id="title"
              type="text"
              maxlength="200"
              placeholder="메모 제목"
              required
            />

            <label for="content">내용</label>

            <textarea
              id="content"
              maxlength="5000"
              placeholder="메모 내용을 입력하세요."
              required
            ></textarea>

            <button id="save-button" type="submit">메모 저장</button>
          </form>

          <p id="memo-message" class="message"></p>
        </div>

        <div class="section-title">
          <h2>저장된 메모</h2>

          <span id="memo-count"></span>
        </div>

        <div id="memo-list"></div>
      </section>
    </main>

    <footer>Secure Memo · 3-Tier Container Architecture</footer>
  </body>
</html>
